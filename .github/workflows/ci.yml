name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Black formatting check
        run: uv run black --check --target-version py312 src/ app/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest --cov=src --cov=app --cov-report=term-missing -v

      - name: Check imports
        run: |
          uv run python -c "from src.config import SR, SEED, NUM_CLASSES, PreprocessingConfig"
          uv run python -c "from src.audio import set_seed, compute_mel_spectrogram"
          uv run python -c "from src.models import get_model, MODEL_REGISTRY"
          uv run python -c "from src.dataset import BowelSoundDataset, get_splits, collate_fn"
          uv run python -c "from app.inference import BowelSoundDetector"